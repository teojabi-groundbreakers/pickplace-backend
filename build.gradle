plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pickplace'
version = '0.2.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 원본 전체 검수는 일반 테스트와 분리한다. 로컬 파일과 격리 Docker MySQL을 명시적으로 사용한다.
tasks.register('verifyNationalStatistics', JavaExec) {
	group = 'verification'
	description = 'T13 전국 원본을 격리 MySQL에 실제 적재하고 게시·재실행을 검증한다.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pickplace.backend.ingestion.statistics.service.RealStatisticsImportVerification'
	maxHeapSize = '512m'
	args projectDir.absolutePath, providers.gradleProperty('statisticsEvidenceFile').getOrElse(
		new File(projectDir.parentFile, 'data-validation/2026-11-10/t14-national/real-verification.json').absolutePath)
}

// 전체 서울 보유 원본 검수는 일반 테스트와 분리해 명시적으로 실행한다.
tasks.register('verifyRegionalDetail', JavaExec) {
	group = 'verification'
	description = '서울 행정동 상세 통계를 격리 MySQL에 적재·검증한다.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.pickplace.backend.ingestion.statistics.service.RealDetailImportVerification'
	maxHeapSize = '768m'
	doFirst {
		args providers.gradleProperty('detailCatalog').get(), providers.gradleProperty('detailEvidence').get()
	}
}
